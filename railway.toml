[build]
builder = "NIXPACKS"
buildCommand = "npm install && cd apps/web && npm run build"

[deploy]
startCommand = "./railway-start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables (set di Railway dashboard)
# YB_SECRETS_MASTER_KEY=...
# NEXT_PUBLIC_SUPABASE_URL=...
# NEXT_PUBLIC_SUPABASE_ANON_KEY=...
# SUPABASE_SERVICE_ROLE_KEY=...
# NEXT_PUBLIC_APP_URL=https://<railway-app>.up.railway.app
# GEMINI_API_KEY=...
# GROQ_API_KEY=...
# OPENROUTER_API_KEY=...
# OPENAI_API_KEY=...
# YOUTUBE_API_KEY=...
# R2_ACCOUNT_ID=...
# R2_ACCESS_KEY_ID=...
# R2_SECRET_ACCESS_KEY=...
# R2_BUCKET_NAME=...
# YB_WORKER_TOKEN=... (generate di dashboard setelah deploy)