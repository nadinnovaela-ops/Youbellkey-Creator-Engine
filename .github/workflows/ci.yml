name: Phase 0 CI Baseline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx --workspace=@youbellkey/web next typegen
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:license
      - run: npm run build --workspace=@youbellkey/web
